[workspace]
members = [".", "crates/core", "crates/format"]

[package]
name = "cookcli"
version = "0.35.0"
edition = "2021"
description = "A command-line interface for managing and working with Cooklang recipes"
license = "MIT"
include = ["/src", "/build.rs", "/Cargo.toml", "/Cargo.lock", "/README.md", "/templates", "/static", "/seed", "/locales"]
repository = "https://github.com/cooklang/cookcli"
homepage = "https://cooklang.org"
keywords = ["cooklang", "recipes", "cli", "cooking"]
categories = ["command-line-utilities"]

[features]
default = ["self-update", "sync", "server", "import", "lsp"]

# `cook server` - the axum web UI. Pulls in the whole HTTP server stack.
server = [
    "dep:axum",
    "dep:axum-extra",
    "dep:tower",
    "dep:tower-http",
    "dep:notify",
    "dep:notify-debouncer-full",
    "dep:tokio-stream",
    "dep:futures-util",
    "dep:open",
]
# `cook import` - scrape a recipe from a website.
import = ["dep:cooklang-import", "dep:reqwest"]
# `cook lsp` - language server for editor integrations.
lsp = ["dep:cooklang-language-server", "dep:tower-lsp"]

self-update = ["dep:self_update", "dep:reqwest"]
# The sync loop only runs inside the web server, so sync implies server.
sync = [
    "server",
    "dep:cooklang-sync-client",
    "dep:uuid",
    "dep:tokio-util",
    "dep:base64",
    "dep:libsqlite3-sys",
    "dep:thiserror",
    "dep:reqwest",
]

[lib]
name = "cookcli"
path = "src/lib.rs"

[[bin]]
name = "cook"
path = "src/main.rs"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
accept-language = "3"
anstream = "1.0"
anyhow = "1"
askama = { version = "0.12", features = ["serde-json"] }
axum = { version = "0.8", features = ["ws"], optional = true }
axum-extra = { version = "0.10", optional = true }
camino = { version = "1", features = ["serde1"] }
chrono = "0.4"
clap = { version = "4.5", features = ["derive"] }
base64 = { version = "0.23", optional = true }
# bundled_units is deliberately NOT enabled: it carries the unit database, and with
# it Converter::default() silently converts quantities to a "best" unit (e.g.
# 5/8 cup -> 10 tbsp) and approximates fractions. Without it the converter is empty
# and quantities stay as authored. If it ever comes back, some dep is leaking it
# through feature unification (`cargo tree -e features -i cooklang`).
cooklang = { version = "0.18.5", default-features = false, features = ["aisle", "pantry", "shopping_list"] }
cooklang-find = { version = "0.6.1", default-features = false }
cooklang-import = { version = "0.9.14", optional = true }
cooklang-sync-client = { version = "0.6.0", optional = true }
libsqlite3-sys = { version = "0.35", features = ["bundled"], optional = true }
cooklang-language-server = { version = "0.2.4", optional = true }
cooklang-reports = { version = "0.5.1" }
# `version` + `path`: local builds use the workspace copy, the published crate
# resolves from crates.io.
cookcli-core = { version = "0.35.0", path = "crates/core" }
directories = "6"
flate2 = "1"
fluent = "0.17"
futures-util = { version = "0.3", optional = true }
fluent-templates = "0.15"
mime_guess = "2.0"
notify = { version = "8", optional = true }
notify-debouncer-full = { version = "0.7", optional = true }
open = { version = "5.3", optional = true }
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"], optional = true }
rust-embed = "8"
# "reqwest" selects the HTTP backend: since 0.44 it is a feature in its own right,
# and "rustls" only configures TLS on an already-enabled backend ("reqwest?/rustls"),
# so without it the crate compiles with no `http_client::get`.
self_update = { version = "0.44", default-features = false, features = ["archive-tar", "archive-zip", "compression-flate2", "reqwest", "rustls"], optional = true }
serde = "1.0"
serde_json = "1.0"
serde_yaml = "0.9"
sys-locale = "0.3"
tabular = { version = "0.2", features = ["ansi-cell"] }
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"], optional = true }
tokio-util = { version = "0.7", optional = true }
thiserror = { version = "2", optional = true }
toml = "1.1.3"
tower = { version = "0.5", features = ["util"], optional = true }
tower-http = { version = "0.7", features = ["fs", "trace", "cors", "normalize-path"], optional = true }
tower-lsp = { version = "0.20", optional = true }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
unic-langid = "0.9"
urlencoding = "2"
url = "2.5"
walkdir = "2"
uuid = { version = "1", features = ["v4"], optional = true }
yansi = "1"

[dev-dependencies]
tempfile = "3"
assert_cmd = "2"
flate2 = "1"
predicates = "3"
walkdir = "2"
insta = { version = "1", features = ["yaml", "json", "filters"] }
strip-ansi-escapes = "0.2"
tokio = { version = "1", features = ["full", "test-util"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
regex = "1"

[profile.release]
strip = true
lto = true
codegen-units = 1
