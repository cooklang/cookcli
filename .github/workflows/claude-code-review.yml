name: Claude Code Review

on:
  pull_request:
    # Drafts are skipped below, so marking one ready is what first reviews it.
    types: [opened, synchronize, reopened, ready_for_review]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"
    #   - "src/**/*.js"
    #   - "src/**/*.jsx"

# Only the latest push to a pull request is worth a review; a newer one
# cancels the review still running for the previous push.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  claude-review:
    # A draft is still being worked on, and every push to it would post a
    # fresh review comment. Review once it is marked ready instead.
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
    
    steps:
      # Dependabot-triggered runs read from the Dependabot secret store, not the
      # Actions one, so CLAUDE_CODE_OAUTH_TOKEN is empty there and the action
      # fails validation — a check that can never go green on a dependency PR,
      # which then blocks `@dependabot merge` forever. Fork PRs get no secrets
      # either, with the same result. Skip the review instead of failing it, and
      # say so in the run summary so a genuinely misconfigured token is still
      # visible. Adding CLAUDE_CODE_OAUTH_TOKEN to the repo's *Dependabot*
      # secrets is what turns the review back on for dependency PRs.
      - name: Check for review credentials
        id: creds
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -n "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::CLAUDE_CODE_OAUTH_TOKEN is not available to this run; skipping the review."
          fi

      - name: Checkout repository
        if: steps.creds.outputs.available == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        if: steps.creds.outputs.available == 'true'
        uses: anthropics/claude-code-action@756cc22e19660d20e8cc9496b4f242475a7f7790 # v1.0.235
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Dependency bumps are exactly the PRs worth a second pair of eyes, but the
          # action refuses bot actors by default. Named explicitly rather than "*" so
          # a future App installed on this public repo cannot drive the review prompt.
          allowed_bots: "dependabot[bot]"
          prompt: |
            Please review this pull request and provide feedback on:
            - Code quality and best practices
            - Potential bugs or issues
            - Performance considerations
            - Security concerns
            - Test coverage
            
            Use the repository's CLAUDE.md for guidance on style and conventions. Be constructive and helpful in your feedback.

            Use `gh pr comment` with your Bash tool to leave your review as a comment on the PR.
          
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://docs.anthropic.com/en/docs/claude-code/sdk#command-line for available options
          claude_args: '--allowed-tools "Bash(gh issue view:*),Bash(gh search:*),Bash(gh issue list:*),Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr list:*)"'

