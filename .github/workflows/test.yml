name: Test

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10

# A new push to a pull request makes the run for the previous one moot; on
# main every commit still gets its own run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - uses: actions/checkout@v7.0.1
      with:
        submodules: recursive

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt, clippy

    - name: Cache Rust
      uses: Swatinem/rust-cache@v2
      with:
        save-if: ${{ github.ref == 'refs/heads/main' }}

    - name: Install Node.js
      uses: actions/setup-node@v7
      with:
        node-version: '22'
        cache: 'npm'

    - name: Install npm dependencies
      run: npm ci

    - name: Build CSS
      run: npm run build-css

    - name: Build JS
      run: npm run build-js

    - name: Check formatting
      run: cargo fmt --all -- --check

    - name: Run clippy
      run: cargo clippy --workspace --all-targets --all-features -- -D warnings

    # Includes tests/snapshot_test.rs. No `--release` build: the release
    # profile's fat LTO took longer than everything else in this job put
    # together, on every OS, and the release workflow builds that profile
    # for every target when a release is cut.
    - name: Run tests
      run: cargo test --workspace --verbose

    - name: Run tests without default features
      run: cargo test --no-default-features --verbose

    - name: Upload snapshot diffs
      if: failure()
      uses: actions/upload-artifact@v7
      with:
        name: snapshot-diffs
        path: tests/snapshots/*.snap.new

  ui-tests:
    name: UI Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - uses: actions/checkout@v7.0.1
      with:
        submodules: recursive

    - name: Setup Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Cache Rust
      uses: Swatinem/rust-cache@v2
      with:
        save-if: ${{ github.ref == 'refs/heads/main' }}

    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version: '22'
        cache: 'npm'

    - name: Install npm dependencies
      run: npm ci

    - name: Build application
      run: |
        npm run build-css
        npm run build-js
        cargo build

    - name: Cache Playwright browsers
      uses: actions/cache@v6
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ hashFiles('package-lock.json') }}

    - name: Install Playwright Browsers
      run: npx playwright install --with-deps chromium

    - name: Run Playwright tests
      run: npm test

    - name: Upload test results
      uses: actions/upload-artifact@v7
      if: always()
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30

    - name: Upload test videos
      uses: actions/upload-artifact@v7
      if: failure()
      with:
        name: test-videos
        path: test-results/
        retention-days: 7

  # Alongside the Ubuntu jobs rather than after them: the Windows job alone is
  # the longest, so chaining it behind the others only added their time.
  test-other-os:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]

    steps:
    - uses: actions/checkout@v7.0.1
      with:
        submodules: recursive

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Cache Rust
      uses: Swatinem/rust-cache@v2
      with:
        save-if: ${{ github.ref == 'refs/heads/main' }}

    - name: Install Node.js
      uses: actions/setup-node@v7
      with:
        node-version: '22'
        cache: 'npm'

    - name: Install npm dependencies
      run: npm ci

    - name: Build CSS
      run: npm run build-css

    - name: Build JS
      run: npm run build-js

    - name: Run tests
      run: cargo test --workspace --verbose
