# based on https://github.com/starship/starship workflow
name: Release
on:
  push:
    branches:
      - main
env:
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  RUST_BACKTRACE: short
  RUSTUP_MAX_RETRIES: 5
  MACOSX_DEPLOYMENT_TARGET: 10.7

# Read-only by default. Each job below asks for the write access it uses, so
# the build jobs — which run npm and cargo build scripts from dependencies —
# never hold a token that can edit the release, push images or publish crates.
permissions:
  contents: read

jobs:
  # Update release PR
  release_please:
    name: Release Please
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.repository == 'cooklang/cookcli'
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          release-type: rust
          draft: true

  # Build sources for every OS
  github_build:
    name: Build release binaries
    needs: release_please
    if: ${{ needs.release_please.outputs.release_created == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            name: cook-x86_64-unknown-linux-gnu.tar.gz

          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            name: cook-x86_64-unknown-linux-musl.tar.gz

          - target: i686-unknown-linux-musl
            os: ubuntu-latest
            name: cook-i686-unknown-linux-musl.tar.gz

          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            name: cook-aarch64-unknown-linux-musl.tar.gz

          - target: arm-unknown-linux-musleabihf
            os: ubuntu-latest
            name: cook-arm-unknown-linux-musleabihf.tar.gz

          - target: x86_64-apple-darwin
            os: macos-15-intel
            name: cook-x86_64-apple-darwin.tar.gz
            notarize: true

          - target: aarch64-apple-darwin
            os: macos-14
            name: cook-aarch64-apple-darwin.tar.gz
            notarize: true

          - target: x86_64-pc-windows-msvc
            os: windows-latest
            name: cook-x86_64-pc-windows-msvc.zip
            rustflags: -C target-feature=+crt-static

          - target: i686-pc-windows-msvc
            os: windows-latest
            name: cook-i686-pc-windows-msvc.zip
            rustflags: -C target-feature=+crt-static

          - target: aarch64-pc-windows-msvc
            os: windows-latest
            name: cook-aarch64-pc-windows-msvc.zip
            rustflags: -C target-feature=+crt-static

          - target: x86_64-unknown-freebsd
            os: ubuntu-latest
            name: cook-x86_64-unknown-freebsd.tar.gz

    runs-on: ${{ matrix.os }}
    # Notarization alone may wait up to 30 min.
    timeout-minutes: 90
    continue-on-error: true
    env:
      RUSTFLAGS: ${{ matrix.rustflags || '' }}
    steps:
      - name: Setup | Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Build CSS
        run: npm run build-css

      - name: Build JS
        run: npm run build-js

      - name: Setup | Rust
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: stable
          target: ${{ matrix.target }}

      - name: Setup | Cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Setup | Install cross [Linux]
        if: matrix.os == 'ubuntu-latest'
        uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: cross

      - name: Build | Build [Cargo]
        if: matrix.os != 'ubuntu-latest'
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Build | Build [Cross]
        if: matrix.os == 'ubuntu-latest'
        run: cross build --release --locked --target ${{ matrix.target }}

      # Keep the glibc binary installable on older distributions (issue #420):
      # fail when it needs a newer glibc than the image in Cross.toml provides.
      - name: Build | Check glibc floor [Linux gnu]
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          FLOOR=2.28
          NEEDED=$(objdump -T "target/${{ matrix.target }}/release/cook" \
            | grep -o 'GLIBC_[0-9.]*' | sed 's/GLIBC_//' | sort -uV | tail -n 1)
          echo "cook needs glibc $NEEDED (floor $FLOOR)"
          if [ "$(printf '%s\n%s\n' "$NEEDED" "$FLOOR" | sort -V | tail -n 1)" != "$FLOOR" ]; then
            echo "::error::cook needs glibc $NEEDED, newer than the $FLOOR floor"
            exit 1
          fi

      # Sign and notarize macOS binaries before packaging
      - name: Notarize | Sign and Notarize [macOS]
        if: matrix.notarize == true
        env:
          APP_CERTIFICATE_BASE64: ${{ secrets.APPLEDEV_APPSIGNKEY_BASE64 }}
          P12_PASSWORD: ${{ secrets.APPLEDEV_SIGNKEY_PASS }}
          KEYCHAIN_PASSWORD: ${{ secrets.APPLEDEV_SIGNKEY_PASS }}
          APPLEID_USERNAME: ${{ secrets.APPLEDEV_ID_NAME }}
          APPLEID_TEAMID: ${{ secrets.APPLEDEV_TEAM_ID }}
          APPLEID_PASSWORD: ${{ secrets.APPLEDEV_PASSWORD }}
          APPLICATION_KEY_IDENT: ${{ secrets.APPLEDEV_KEY_IDENT }}
        run: |
          # Setup variables
          BINARY_PATH="target/${{ matrix.target }}/release/cook"
          KEYCHAIN_FILENAME="app-signing.keychain-db"
          KEYCHAIN_ENTRY="AC_PASSWORD"
          APP_CERTIFICATE_PATH="$RUNNER_TEMP/app_certificate.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/$KEYCHAIN_FILENAME"

          # Import certificates from secrets
          echo -n "$APP_CERTIFICATE_BASE64" | base64 --decode -o "$APP_CERTIFICATE_PATH"

          # Create temporary keychain
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Import certificates to keychain
          security import "$APP_CERTIFICATE_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"

          # Add Apple Developer ID credentials to keychain
          xcrun notarytool store-credentials "$KEYCHAIN_ENTRY" \
            --team-id "$APPLEID_TEAMID" \
            --apple-id "$APPLEID_USERNAME" \
            --password "$APPLEID_PASSWORD" \
            --keychain "$KEYCHAIN_PATH"

          echo ">>>> Signing binary"
          codesign --timestamp \
            --keychain "$KEYCHAIN_PATH" \
            --sign "$APPLICATION_KEY_IDENT" \
            --options runtime \
            --force \
            --verbose \
            "$BINARY_PATH"

          # Verify signing
          echo ">>>> Verifying signature"
          codesign --verify --verbose "$BINARY_PATH"

          # Make ZIP file for notarization (must be a zip for notarization)
          echo ">>>> Creating ZIP for notarization"
          cd "target/${{ matrix.target }}/release"
          zip -r cook-notarize.zip cook

          # The submission id comes from this submission's own output, not from
          # `notarytool history`: both macOS targets notarize at the same time,
          # so the newest entry in the history may be the other job's.
          echo ">>>> Submitting for notarization"
          submission=$(xcrun notarytool submit cook-notarize.zip \
            --keychain-profile "$KEYCHAIN_ENTRY" \
            --keychain "$KEYCHAIN_PATH" \
            --wait \
            --timeout 30m \
            --output-format json)
          echo "$submission"
          submission_id=$(jq -r '.id' <<< "$submission")
          submission_status=$(jq -r '.status' <<< "$submission")

          echo ">>>> Notarization log for $submission_id"
          xcrun notarytool log "$submission_id" \
            --keychain-profile "$KEYCHAIN_ENTRY" \
            --keychain "$KEYCHAIN_PATH"

          # Still shipped when Apple rejects it, as before — the binary runs
          # from a terminal either way — but no longer silently.
          if [ "$submission_status" != "Accepted" ]; then
            echo "::warning::Notarization of ${{ matrix.target }} ended as '$submission_status' (submission $submission_id)"
          fi

          # Note: We can't staple to a standalone binary, only to app bundles, DMGs, or PKGs
          # But the notarization is still recorded with Apple and will be checked online

          echo ">>>> Verifying notarization"
          spctl -a -t open --context context:primary-signature -v cook || true

          # Clean up
          rm cook-notarize.zip
          cd -

          # Clean up keychain
          security delete-keychain "$KEYCHAIN_PATH"

      - name: Post Build | Prepare artifacts [Windows]
        if: matrix.os == 'windows-latest'
        run: |
          cd target/${{ matrix.target }}/release
          7z a ../../../${{ matrix.name }} cook.exe
          cd -

      - name: Post Build | Prepare artifacts [-nix]
        if: matrix.os != 'windows-latest'
        run: |
          cd target/${{ matrix.target }}/release
          tar czvf ../../../${{ matrix.name }} cook
          cd -

      - name: Release | Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.name }}

  # A source tarball that already contains the npm-generated front-end assets
  # (issue #445). GitHub's auto-generated tag archives omit them — they are
  # gitignored — and build.rs then refuses to build, so downstream packagers on
  # platforms with no prebuilt lightningcss/esbuild binary (OpenBSD, for one)
  # cannot produce them locally at all.
  source_tarball:
    name: Build source tarball
    needs: release_please
    if: ${{ needs.release_please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # As for github_build: upload_artifacts is what flips the release out of
    # draft, so a job it needs failing hard would strand the release as a draft
    # with no binaries attached. A missing source tarball is worth a red job in
    # the Actions UI, not a stuck release — an npm registry hiccup here says
    # nothing about the platform builds.
    continue-on-error: true
    steps:
      - name: Setup | Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.release_please.outputs.tag_name }}

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Build CSS
        run: npm run build-css

      - name: Build JS
        run: npm run build-js

      - name: Build | Source tarball
        # packaging/source-tarball.sh also checks the assets made it in, and
        # is what build-rpm.sh uses, so the RPM workflow tests this path.
        run: |
          set -euo pipefail
          tarball=$(./packaging/source-tarball.sh .)

          # The script names the tarball after Cargo.toml's version. On a
          # release-please tag the two agree; if they ever do not, stop rather
          # than attach an asset named after another version.
          if [ "$(basename "$tarball")" != "cook-${TAG#v}-source.tar.gz" ]; then
            echo "tag $TAG does not match $(basename "$tarball")" >&2
            exit 1
          fi
        env:
          TAG: ${{ needs.release_please.outputs.tag_name }}

      # Named to match the `cook-*` pattern that upload_artifacts downloads,
      # checksums and attaches to the release.
      - name: Release | Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cook-source.tar.gz
          path: cook-*-source.tar.gz

  # RPMs for Fedora users: built from the source tarball in Fedora containers
  # (oldest maintained release plus latest, x86_64 and aarch64) and attached to
  # the GitHub release next to the tarballs.
  rpm_build:
    name: Build RPM (Fedora ${{ matrix.fedora }}, ${{ matrix.arch }})
    needs: [release_please, source_tarball]
    if: ${{ needs.release_please.outputs.release_created == 'true' }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # Oldest maintained Fedora first: the RPM then also installs on every
          # newer release, where glibc is forward compatible.
          - fedora: '42'
            arch: x86_64
            runner: ubuntu-latest
          - fedora: latest
            arch: x86_64
            runner: ubuntu-latest
          - fedora: latest
            arch: aarch64
            runner: ubuntu-24.04-arm
    container: fedora:${{ matrix.fedora }}
    # As for github_build: upload_artifacts is what flips the release out of
    # draft, so a failed RPM build must not strand the release.
    continue-on-error: true
    steps:
      # actions/checkout needs git, so the tools come first. Rust comes from
      # the distribution rather than rustup: that is the toolchain the spec's
      # BuildRequires asks for, and rpmbuild checks those against installed
      # packages, so a rustup toolchain leaves the build root "missing" both.
      - name: Setup | Install tools
        run: dnf install -y rpm-build gcc git tar xz curl rust cargo

      - name: Setup | Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.release_please.outputs.tag_name }}

      # A named download extracts the artifact's contents straight into
      # `path`, so the tarball lands in source/, not in a directory named
      # after the artifact.
      - name: Setup | Source tarball
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cook-source.tar.gz
          path: source

      - name: Build | RPM
        run: ./packaging/fedora/build-rpm.sh "$(ls source/cook-*-source.tar.gz)"

      # Named to match the `cook*` pattern that upload_artifacts downloads,
      # checksums and attaches to the release.
      - name: Release | Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cook-rpm-fedora-${{ matrix.fedora }}-${{ matrix.arch }}
          if-no-files-found: error
          path: dist/rpm/*.rpm

  # .deb packages for Debian and Ubuntu, built on Ubuntu 22.04 — the oldest
  # glibc among them — so each installs on Ubuntu 22.04+ and Debian 12+.
  # deb.yaml builds them the same way and test-installs them on each.
  deb_build:
    name: Build .deb (${{ matrix.arch }})
    needs: release_please
    if: ${{ needs.release_please.outputs.release_created == 'true' }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    container: ubuntu:22.04
    # Container steps otherwise run under `sh`, which is dash here and has no
    # `pipefail`.
    defaults:
      run:
        shell: bash
    # As for github_build: upload_artifacts is what flips the release out of
    # draft, so a failed package build must not strand the release.
    continue-on-error: true
    steps:
      - name: Setup | Install tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends build-essential dpkg-dev curl ca-certificates
        env:
          DEBIAN_FRONTEND: noninteractive

      - name: Setup | Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.release_please.outputs.tag_name }}

      - name: Setup | Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Setup | Rust
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: stable

      - name: Build | .deb
        run: |
          set -euo pipefail
          npm ci
          npm run build-css
          npm run build-js
          ./packaging/debian/build-deb.sh

      # Named to match the `cook*` pattern that upload_artifacts downloads,
      # checksums and attaches to the release; the files themselves are
      # cookcli_<version>-1_<arch>.deb.
      - name: Release | Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cook-deb-${{ matrix.arch }}
          if-no-files-found: error
          path: dist/deb/*.deb

  # Create GitHub release with Rust build targets and release notes
  upload_artifacts:
    name: Add Build Artifacts to Release
    needs: [release_please, github_build, source_tarball, rpm_build, deb_build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Setup | Artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: cook-*

      # The build jobs are continue-on-error so one broken platform cannot
      # strand the release as a draft — which also means a missing asset turns
      # no job red. The Windows MSI went missing that way for every release
      # until it was removed. List what did not arrive, on the run's summary
      # page, without blocking the release. Keep in step with the matrices
      # of github_build, source_tarball, rpm_build and deb_build.
      - name: Check | Every expected artifact arrived
        run: |
          missing=()
          for artifact in \
            cook-x86_64-unknown-linux-gnu.tar.gz \
            cook-x86_64-unknown-linux-musl.tar.gz \
            cook-i686-unknown-linux-musl.tar.gz \
            cook-aarch64-unknown-linux-musl.tar.gz \
            cook-arm-unknown-linux-musleabihf.tar.gz \
            cook-x86_64-apple-darwin.tar.gz \
            cook-aarch64-apple-darwin.tar.gz \
            cook-x86_64-pc-windows-msvc.zip \
            cook-i686-pc-windows-msvc.zip \
            cook-aarch64-pc-windows-msvc.zip \
            cook-x86_64-unknown-freebsd.tar.gz \
            cook-source.tar.gz \
            cook-rpm-fedora-42-x86_64 \
            cook-rpm-fedora-latest-x86_64 \
            cook-rpm-fedora-latest-aarch64 \
            cook-deb-amd64 \
            cook-deb-arm64
          do
            if [ -z "$(ls -A "$artifact" 2>/dev/null)" ]; then
              missing+=("$artifact")
            fi
          done

          if [ ${#missing[@]} -eq 0 ]; then
            echo "All expected artifacts arrived." >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "### Missing from this release"
              printf -- "- \`%s\`\n" "${missing[@]}"
            } >> "$GITHUB_STEP_SUMMARY"
            for artifact in "${missing[@]}"; do
              echo "::warning::$artifact was not built; the release goes out without it"
            done
          fi

      # `cook*` rather than `cook-*` for the files: the RPMs are named after
      # the package, `cookcli-<version>-…rpm`, and a hyphen here would drop
      # them from both the checksums and the release.
      - name: Setup | Checksums
        run: for file in cook*/cook*; do openssl dgst -sha256 -r "$file" | awk '{print $1}' > "${file}.sha256"; done

      - name: Setup | Publish Release
        run: gh release edit "$TAG" --draft=false --repo=cooklang/cookcli
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release_please.outputs.tag_name }}

      - name: Build | Add Artifacts to Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: cook*/cook*
          tag_name: ${{ needs.release_please.outputs.tag_name }}

  # Publish to crates.io
  publish_crates:
    name: Publish to crates.io
    needs: release_please
    if: ${{ needs.release_please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      # crates.io trusted publishing exchanges this job's OIDC token.
      id-token: write
    steps:
      - name: Setup | Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Build CSS
        run: npm run build-css

      - name: Build JS
        run: npm run build-js

      - name: Setup | Rust
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: stable
      
      - name: Authenticate to crates.io
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
        id: auth

      # The chain is cooklang-format -> cookcli-core -> cookcli: crates.io
      # rejects a package whose dependency is not already published, so each
      # link goes up only after the one it depends on is resolvable from the
      # registry.
      #
      # release-please's `rust` strategy bumps every workspace member to the
      # release version. It must also rewrite the `version` requirement on the
      # path dependencies (cookcli -> cookcli-core -> cooklang-format); if it
      # does not, publishing fails here on an unresolvable dependency rather
      # than silently shipping something wrong. Check the release PR's diff the
      # first time this runs.
      #
      # The guard below is for a re-run of an already-published release, where
      # `cargo publish` would fail on "crate version already uploaded" and take
      # the job down with it.
      - name: Publish | crates.io (cooklang-format)
        run: |
          set -euo pipefail
          version=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "cooklang-format") | .version')
          echo "cooklang-format version: $version"
          status=$(curl -sS -o /dev/null -w '%{http_code}' \
            -H 'User-Agent: cookcli-release (https://github.com/cooklang/cookcli)' \
            "https://crates.io/api/v1/crates/cooklang-format/$version")
          case "$status" in
            200)
              echo "cooklang-format $version is already on crates.io; skipping."
              ;;
            404)
              cargo publish -p cooklang-format --allow-dirty
              ;;
            *)
              echo "Unexpected status $status from crates.io; refusing to guess." >&2
              exit 1
              ;;
          esac
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

      # cookcli depends on cookcli-core by `version` + `path`, and crates.io
      # rejects a package whose dependency is not already published — so core
      # goes first, and cookcli only after it is resolvable from the registry.
      #
      # release-please's `rust` strategy bumps every workspace member to the
      # release version, so on a normal release this version is always new.
      # The guard is for a re-run of an already-published release, where
      # `cargo publish` would fail on "crate version already uploaded" and take
      # the job down with it. Gating on the version rather than
      # `continue-on-error`, so a genuine publish failure still fails the job.
      - name: Publish | crates.io (cookcli-core)
        run: |
          set -euo pipefail
          version=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "cookcli-core") | .version')
          echo "cookcli-core version: $version"
          status=$(curl -sS -o /dev/null -w '%{http_code}' \
            -H 'User-Agent: cookcli-release (https://github.com/cooklang/cookcli)' \
            "https://crates.io/api/v1/crates/cookcli-core/$version")
          case "$status" in
            200)
              echo "cookcli-core $version is already on crates.io; skipping."
              ;;
            404)
              cargo publish -p cookcli-core --allow-dirty
              ;;
            *)
              echo "Unexpected status $status from crates.io; refusing to guess." >&2
              exit 1
              ;;
          esac
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

      - name: Publish | crates.io (cookcli)
        run: cargo publish -p cookcli --allow-dirty
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  # Build and push Docker image to GHCR
  docker_publish:
    name: Build Docker image (${{ matrix.platform }})
    needs: release_please
    if: ${{ needs.release_please.outputs.release_created == 'true' }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Setup | Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup | Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Pushed by digest only: the per-platform images need no tag of their
      # own. The old `build-0`/`build-1` tags were overwritten each release
      # and sat in the public registry next to the real versions.
      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=ghcr.io/cooklang/cookcli,push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,scope=${{ matrix.platform }},mode=max

      - name: Export digest
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}

      # Not `cook-*`: upload_artifacts attaches everything named that way to
      # the release.
      - name: Upload digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docker-digest-${{ strategy.job-index }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  docker_merge:
    name: Create multi-arch manifest
    needs: [release_please, docker_publish]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      packages: write
    steps:
      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup | Digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: docker-digest-*
          merge-multiple: true
          path: ${{ runner.temp }}/digests

      # One file per platform image, named after its digest.
      - name: Create and push manifest
        working-directory: ${{ runner.temp }}/digests
        run: |
          set -euo pipefail
          images=()
          for digest in *; do
            images+=("ghcr.io/cooklang/cookcli@sha256:$digest")
          done
          docker buildx imagetools create \
            -t "ghcr.io/cooklang/cookcli:${TAG#v}" \
            -t ghcr.io/cooklang/cookcli:latest \
            "${images[@]}"
          docker buildx imagetools inspect "ghcr.io/cooklang/cookcli:${TAG#v}"
        env:
          TAG: ${{ needs.release_please.outputs.tag_name }}


