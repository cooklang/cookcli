version: 2
updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: cron
      cronjob: "0 5 1,15 * *"
    commit-message:
      prefix: chore
      include: scope
    groups:
      cargo-minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: cron
      cronjob: "0 5 1,15 * *"
    commit-message:
      prefix: chore
      include: scope
    groups:
      npm-minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: cron
      cronjob: "0 5 1,15 * *"
    commit-message:
      prefix: chore
      include: scope
