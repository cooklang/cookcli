{% extends "base.html" %}

{% block title %}{{ tr.t("error-title") }} - Cook{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto mt-12">
    <div class="card p-5 border-l-[3px] border-l-danger">
        <div class="flex items-start gap-3.5">
            <div class="shrink-0 text-danger">
                <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-2.5L13.732 4c-.77-.833-1.964-.833-2.732 0L4.082 16.5c-.77.833.192 2.5 1.732 2.5z"></path>
                </svg>
            </div>
            <div class="min-w-0">
                <h2 class="text-display font-bold text-text mb-1.5">{{ tr.t("error-title") }}</h2>
                <p class="text-danger font-mono text-sm whitespace-pre-wrap break-words">{{ error_message }}</p>
            </div>
        </div>
        <div class="mt-5">
            <a href="{{ prefix }}/" class="btn">
                {{ tr.t("error-back-home") }}
            </a>
        </div>
    </div>
</div>
{% endblock %}
