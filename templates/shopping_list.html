{% extends "base.html" %}

{% block title %}{{ tr.t("nav-shopping-list") }} - Cook{% endblock %}

{% block content %}
<div class="flex flex-col lg:flex-row gap-6">
    <!-- Sidebar with selected recipes and pantry -->
    <div class="lg:w-2/5 xl:w-1/3">
        <div class="card p-6 sticky top-6">
            <h2 class="font-bold text-title mb-3 text-accent-text">{{ tr.t("shopping-selected-recipes") }}</h2>
            <div id="selected-recipes" class="space-y-2 mb-6">
            </div>

            <!-- Pantry items section -->
            <div id="pantry-section" class="hidden">
                <h2 class="font-bold text-title mb-3 text-text">{{ tr.t("shopping-in-pantry") }}</h2>
                <div id="pantry-items" class="bg-sunk rounded-[var(--radius-control)] p-3 border border-line max-h-64 overflow-y-auto">
                </div>
            </div>
        </div>
    </div>

    <!-- Main content area with shopping list -->
    <div class="flex-1">
        <div id="error-banner" class="hidden mb-4 card p-4 border-l-[3px] border-l-danger bg-danger-soft">
            <div class="flex items-start gap-3">
                <div class="shrink-0 text-danger">
                    <svg class="w-5 h-5 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-2.5L13.732 4c-.77-.833-1.964-.833-2.732 0L4.082 16.5c-.77.833.192 2.5 1.732 2.5z"></path>
                    </svg>
                </div>
                <div class="flex-1">
                    <p id="error-message" class="text-text text-sm font-mono whitespace-pre-wrap"></p>
                </div>
                <button type="button" onclick="hideError()" class="icon-btn shrink-0" aria-label="{{ tr.t("aria-dismiss") }}">
                    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                    </svg>
                </button>
            </div>
        </div>

        <!-- Heading and list actions share a row; the heading lives here rather
             than in the JS-rendered list so the buttons stay put while the list
             below them re-renders. -->
        <div id="shopping-list-header" class="hidden flex-wrap items-center justify-between gap-3 mb-4">
            <h1 class="text-display font-bold text-text">{{ tr.t("shopping-title") }}</h1>
            <div class="flex items-center gap-2">
                <!-- Split button: the left half copies, the right half opens the
                     checkboxes that decide what the copied text contains. -->
                <div id="copy-list-group" class="hidden relative">
                    <div class="flex">
                        <button id="copy-list-button" type="button" onclick="copyList()" class="btn btn-primary rounded-r-none">
                            {{ tr.t("shopping-copy") }}
                        </button>
                        <button id="copy-options-toggle" type="button" onclick="toggleCopyOptions()"
                                aria-haspopup="true" aria-expanded="false" aria-controls="copy-options-menu"
                                aria-label="{{ tr.t("shopping-copy-options") }}"
                                class="btn btn-primary rounded-l-none -ml-px px-3 border-l-accent-ink/25">
                            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
                            </svg>
                        </button>
                    </div>
                    <div id="copy-options-menu" class="hidden absolute right-0 mt-2 w-64 card shadow-[var(--shadow-overlay)] z-50 py-1">
                        <label class="flex items-center gap-3 px-4 py-2.5 text-sm text-text hover:bg-sunk cursor-pointer">
                            <input type="checkbox" id="copy-option-aisles" onchange="onCopyOptionChange()"
                                   class="w-4 h-4 accent-[var(--accent)]">
                            <span>{{ tr.t("shopping-copy-include-aisles") }}</span>
                        </label>
                        <label class="flex items-center gap-3 px-4 py-2.5 text-sm text-text hover:bg-sunk cursor-pointer">
                            <input type="checkbox" id="copy-option-amounts" onchange="onCopyOptionChange()"
                                   class="w-4 h-4 accent-[var(--accent)]">
                            <span>{{ tr.t("shopping-copy-include-amounts") }}</span>
                        </label>
                    </div>
                </div>
                <button type="button" onclick="clearList()" class="btn">
                    {{ tr.t("shopping-clear-all") }}
                </button>
            </div>
        </div>

        <div id="shopping-list-results">
            <div id="list-content"></div>
        </div>
    </div>
</div>

<script>
let shoppingList = [];

// Last payload rendered by displayShoppingList(), kept so the copy button can
// rebuild the list as plain text without re-fetching.
let lastListData = null;

// Escape a string for safe interpolation into HTML text or a double-quoted
// attribute value. Recipe names/paths come from filenames — a recipe called
// `<img src=x onerror=alert(1)>.cook` is a legal filename on most systems,
// so every untrusted interpolation must flow through this.
function escHtml(s) {
    return String(s == null ? '' : s)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
}

// Encode each path segment so special chars like `#`, `?`, `&`, `=` don't
// break the URL. `encodeURI` intentionally leaves those alone (they're
// valid URI delimiters), which is wrong here — a recipe filename can
// legitimately contain any of them.
function encodeRecipePath(path) {
    return String(path == null ? '' : path)
        .split('/')
        .map(encodeURIComponent)
        .join('/');
}

function showError(message) {
    const banner = document.getElementById('error-banner');
    const msg = document.getElementById('error-message');
    msg.textContent = message;
    banner.classList.remove('hidden');
}

function hideError() {
    document.getElementById('error-banner').classList.add('hidden');
}

// The last markup written into each container. Renders compare against it —
// never against `innerHTML`, which the browser re-serialises — and leave the
// DOM alone when nothing changed, so a refresh that brings back the same list
// doesn't recreate the checkbox under the user's finger.
const renderedHtml = new WeakMap();

function setHtml(element, html) {
    if (renderedHtml.get(element) === html) return;
    element.innerHTML = html;
    renderedHtml.set(element, html);
}

// Refreshes run one at a time. 'list' regenerates the whole list (whose
// response carries the ticks as well); 'checked' only re-reads the ticks.
// Asking for either while one runs queues a single follow-up, 'list' winning,
// so a burst of requests costs at most one extra round.
let pendingRefresh = null;
let refreshing = null;

function requestRefresh(kind) {
    if (pendingRefresh !== 'list') {
        pendingRefresh = kind;
    }
    if (!refreshing) {
        refreshing = runRefreshes();
    }
    return refreshing;
}

async function runRefreshes() {
    // The `finally` belongs in here, not on the returned promise: one attached
    // with `.finally()` runs a tick late, and a request arriving in that gap
    // would queue behind a loop that has already stopped.
    try {
        while (pendingRefresh) {
            const kind = pendingRefresh;
            pendingRefresh = null;
            try {
                await (kind === 'list' ? refreshList() : refreshChecked());
            } catch (error) {
                console.error('Failed to refresh the shopping list:', error);
            }
        }
    } finally {
        refreshing = null;
    }
}

// The `/items` response the list on the page was last generated from. A 'list'
// refresh that reads the same items back — the echo of a change this page made
// itself, or the refresh every event-stream connection starts with — only
// re-reads the ticks instead of re-parsing every recipe.
let generatedFrom = null;

async function refreshList() {
    const ticks = tickSnapshot();
    const response = await fetch('{{ prefix }}/api/shopping_list/items');
    if (!response.ok) {
        throw new Error(`loading the shopping list answered ${response.status}`);
    }
    const items = await response.text();
    if (items === generatedFrom) {
        return refreshChecked(ticks);
    }

    generatedFrom = null;
    shoppingList = JSON.parse(items);
    renderSelectedRecipes();

    // Automatically generate the shopping list if there are items
    if (shoppingList.length > 0) {
        const data = await generateList();
        if (!data) return;
        displayShoppingList(data);
        applyServerChecked(data.checked || [], ticks);
    }
    generatedFrom = items;
}

async function refreshChecked(ticks = tickSnapshot()) {
    const response = await fetch('{{ prefix }}/api/shopping_list/checked');
    if (!response.ok) {
        throw new Error(`loading the ticked items answered ${response.status}`);
    }
    applyServerChecked(await response.json(), ticks);
}

function renderSelectedRecipes() {
    const container = document.getElementById('selected-recipes');

    // The heading and its buttons live in the same row, so the row follows the
    // selection rather than the generated items: with recipes selected but
    // every ingredient in the pantry there is nothing to copy, yet Clear All
    // still has to be reachable.
    setHeaderVisible(shoppingList.length > 0);

    if (shoppingList.length === 0) {
        setHtml(container, '<p class="text-faint text-sm">' + escHtml({{ tr.t("shopping-no-recipes")|json|safe }}) + '</p>');
        setHtml(document.getElementById('list-content'), '<p class="text-faint">' + escHtml({{ tr.t("shopping-no-items")|json|safe }}) + '</p>');
        document.getElementById('pantry-section').classList.add('hidden');
        lastListData = null;
        updateCopyButtonVisibility();
        return;
    }

    setHtml(container, shoppingList.map((item, index) => {
        // Plan/menu entry — show nested recipes
        if (item.recipes) {
            const recipesHtml = item.recipes.map(recipe => {
                const refs = recipe.included_references || [];
                const refsHtml = refs.length > 0 ? `
                    <ul class="mt-1 ml-8 pl-2 border-l border-line space-y-0.5">
                        ${refs.map(ref => {
                            const refName = ref.split('/').pop();
                            return `<li class="text-xs text-faint flex items-center gap-1">
                                <svg class="w-3 h-3 text-faint shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1"></path>
                                </svg>
                                <a href="{{ prefix }}/recipe/${encodeRecipePath(ref)}" class="hover:text-accent-text hover:underline">${escHtml(refName)}</a>
                            </li>`;
                        }).join('')}
                    </ul>` : '';
                return `<li class="text-sm text-muted flex flex-col">
                    <div class="flex items-center gap-1">
                        <svg class="w-3 h-3 text-faint shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path>
                        </svg>
                        <a href="{{ prefix }}/recipe/${encodeRecipePath(recipe.path)}" class="hover:text-accent-text hover:underline">${escHtml(recipe.name)}</a>
                        <span class="text-faint text-xs">(×${escHtml(recipe.scale)})</span>
                    </div>
                    ${refsHtml}
                </li>`;
            }).join('');

            return `
            <div class="bg-sunk p-3 rounded-[var(--radius-control)] border border-line">
                <div class="flex items-center justify-between">
                    <div>
                        <a href="{{ prefix }}/recipe/${encodeRecipePath(item.path)}" class="font-medium text-text hover:text-accent-text underline decoration-[var(--text-faint)] hover:decoration-[var(--accent)]">${escHtml(item.name)}</a>
                        <span class="text-accent-text ml-2 text-xs font-semibold uppercase">plan</span>
                    </div>
                    <button type="button" data-action="remove-recipe" data-path="${escHtml(item.path)}" class="text-danger hover:underline font-medium text-sm">
                        {{ tr.t("shopping-remove") }}
                    </button>
                </div>
                <ul class="mt-2 ml-4 space-y-1">${recipesHtml}</ul>
            </div>`;
        }

        // Regular recipe entry
        const refs = item.included_references || [];
        const refsHtml = refs.length > 0 ? `
            <ul class="mt-1 ml-8 pl-2 border-l border-line space-y-0.5">
                ${refs.map(ref => {
                    const refName = ref.split('/').pop();
                    return `<li class="text-sm text-faint flex items-center gap-1">
                        <svg class="w-3 h-3 text-faint shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1"></path>
                        </svg>
                        <a href="{{ prefix }}/recipe/${encodeRecipePath(ref)}" class="hover:text-accent-text hover:underline">${escHtml(refName)}</a>
                    </li>`;
                }).join('')}
            </ul>` : '';

        return `
        <div class="bg-sunk p-3 rounded-[var(--radius-control)] border border-line">
            <div class="flex items-center justify-between">
                <div>
                    <a href="{{ prefix }}/recipe/${encodeRecipePath(item.path)}" class="font-medium text-text hover:text-accent-text underline decoration-[var(--text-faint)] hover:decoration-[var(--accent)]">${escHtml(item.name)}</a>
                    <span class="text-muted ml-2 text-sm">(×${escHtml(item.scale)})</span>
                </div>
                <button type="button" data-action="remove-recipe" data-path="${escHtml(item.path)}" class="text-danger hover:underline font-medium text-sm">
                    {{ tr.t("shopping-remove") }}
                </button>
            </div>
            ${refsHtml}
        </div>`;
    }).join(''));
}

// Event delegation for dynamically-rendered remove buttons: avoids inline
// `onclick="removeRecipe('${path}')"` which would execute any single-quote
// break in a recipe path. `data-path` is HTML-escaped, then read as a string.
document.addEventListener('click', (event) => {
    const btn = event.target.closest('[data-action="remove-recipe"]');
    if (!btn) return;
    removeRecipe(btn.dataset.path);
});

// Same delegation trick for ingredient checkboxes — inline `onchange` with
// unescaped ingredient names would execute script if a name contained a
// single quote. Values are read from data-* which are plain strings.
document.addEventListener('change', (event) => {
    const input = event.target.closest('[data-action="toggle-item"]');
    if (!input) return;
    toggleItem(input);
});

async function removeRecipe(path) {
    try {
        const response = await fetch('{{ prefix }}/api/shopping_list/remove', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
            },
            body: JSON.stringify({ path })
        });

        if (response.ok) {
            hideError();
            await requestRefresh('list');
        } else {
            const data = await response.json().catch(() => ({}));
            showError(data.error || 'Failed to remove recipe');
        }
    } catch (error) {
        console.error('Failed to remove recipe:', error);
        showError('Failed to remove recipe');
    }
}

async function clearList() {
    try {
        const response = await fetch('{{ prefix }}/api/shopping_list/clear', {
            method: 'POST',
        });

        if (response.ok) {
            hideError();
            await requestRefresh('list');
        } else {
            const data = await response.json().catch(() => ({}));
            showError(data.error || 'Failed to clear list');
        }
    } catch (error) {
        console.error('Failed to clear list:', error);
        showError('Failed to clear list');
    }
}

// Generate the list for the recipes in `shoppingList`. Returns the generated
// list, or null once it has shown why there isn't one.
async function generateList() {
    hideError();

    if (shoppingList.length === 0) {
        showError({{ tr.t("shopping-add-recipes-first")|json|safe }});
        return null;
    }

    try {
        const response = await fetch('{{ prefix }}/api/shopping_list', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
            },
            body: JSON.stringify(shoppingList.flatMap(item => {
                // Plan/menu entry — expand into individual recipe requests,
                // plus the menu itself (with no references) so its freehand
                // ingredients are included in the shopping list.
                if (item.recipes) {
                    const menuFreehand = {
                        recipe: item.path,
                        scale: item.scale,
                        included_references: []
                    };
                    const recipeRequests = item.recipes.map(recipe => {
                        const req = { recipe: recipe.path, scale: recipe.scale };
                        if (recipe.included_references) {
                            req.included_references = recipe.included_references;
                        }
                        return req;
                    });
                    return [menuFreehand, ...recipeRequests];
                }
                // Regular recipe entry
                const req = { recipe: item.path, scale: item.scale };
                if (item.included_references) {
                    req.included_references = item.included_references;
                }
                return [req];
            }))
        });

        const data = await response.json();
        if (!response.ok) {
            showError(data.error || {{ tr.t("shopping-failed-to-generate")|json|safe }});
            return null;
        }
        return data;
    } catch (error) {
        console.error('Failed to generate shopping list:', error);
        showError({{ tr.t("shopping-failed-to-generate")|json|safe }});
        return null;
    }
}

// Format a Cooklang Number tagged enum ({type: "regular"|"fraction", value: ...})
function formatCooklangNumber(num) {
    if (!num || typeof num !== 'object') return '';
    switch (num.type) {
        case 'regular':
            return formatNumber(num.value);
        case 'fraction': {
            const f = num.value;
            const whole = f.whole || 0;
            const numerator = f.num || 0;
            const den = f.den || 1;
            if (whole > 0 && numerator > 0) {
                return `${whole} ${numerator}/${den}`;
            } else if (numerator > 0) {
                return `${numerator}/${den}`;
            } else if (whole > 0) {
                return `${whole}`;
            }
            return '0';
        }
        default:
            return '';
    }
}

// Format a Cooklang Value tagged enum ({type: "number"|"range"|"text", value: ...})
function formatCooklangValue(value) {
    if (!value || typeof value !== 'object') return '';
    switch (value.type) {
        case 'number':
            return formatCooklangNumber(value.value);
        case 'range': {
            const start = formatCooklangNumber(value.value.start);
            const end = formatCooklangNumber(value.value.end);
            return `${start} - ${end}`;
        }
        case 'text':
            return typeof value.value === 'string' ? value.value : '';
        default:
            return '';
    }
}

// Format numbers with fractions
function formatNumber(value) {
    // Round to reasonable precision
    const rounded = Math.round(value * 1000000) / 1000000;

    // Check if it's effectively a whole number
    if (Math.abs(rounded % 1) < 0.0000001) {
        return Math.floor(rounded).toString();
    }

    // Try to convert to common fraction
    const fraction = decimalToFraction(rounded);
    if (fraction) {
        return fraction;
    }

    // Format as decimal with appropriate precision
    const rounded3 = Math.round(rounded * 1000) / 1000;
    let result = rounded3.toString();

    // Remove trailing zeros after decimal point
    if (result.includes('.')) {
        result = result.replace(/\.?0+$/, '');
    }

    return result;
}

function decimalToFraction(value) {
    const epsilon = 0.0001;
    const whole = Math.floor(value);
    const fract = value - whole;

    const commonFractions = [
        [0.125, "1/8"],
        [0.25, "1/4"],
        [0.333333, "1/3"],
        [0.375, "3/8"],
        [0.5, "1/2"],
        [0.625, "5/8"],
        [0.666667, "2/3"],
        [0.75, "3/4"],
        [0.875, "7/8"]
    ];

    for (const [decimal, fractionStr] of commonFractions) {
        if (Math.abs(fract - decimal) < epsilon) {
            if (whole > 0) {
                return `${whole} ${fractionStr}`;
            } else {
                return fractionStr;
            }
        }
    }

    return null;
}

// Render the generated list. The markup carries no ticks — those are applied
// separately by applyCheckedStates() — so a list whose items haven't changed
// renders to the same markup and setHtml() leaves it in place.
function displayShoppingList(data) {
    const resultsDiv = document.getElementById('shopping-list-results');
    const contentDiv = document.getElementById('list-content');
    const pantrySection = document.getElementById('pantry-section');
    const pantryItems = document.getElementById('pantry-items');

    lastListData = data;
    // Live updates from another tab render here too, so make sure the
    // container is showing whatever hid it earlier.
    resultsDiv.classList.remove('hidden');

    let html = '';

    // Display items to buy (organized by aisle)
    if (data.categories && data.categories.length > 0) {
        html += data.categories.map((category, categoryIndex) => `
            <div class="aisle-section mb-6 card p-4">
                <h2 class="aisle-name font-semibold text-title mb-3 text-accent-text">${escHtml(category.category)}</h2>
                <ul class="space-y-2">
                    ${category.items.map((item, itemIndex) => {
                        // Positional rather than derived from the name, which
                        // could collide ("olive oil" and "olive-oil") and send
                        // a click on one label to the other's checkbox.
                        const itemId = `item-${categoryIndex}-${itemIndex}`;
                        return `
                        <li class="flex items-center justify-between py-2 px-3 hover:bg-sunk rounded-[var(--radius-control)]">
                            <div class="flex items-center flex-1">
                                <input type="checkbox"
                                    id="${itemId}"
                                    class="list-checkbox accent-[var(--accent)] mr-3"
                                    data-action="toggle-item"
                                    data-ingredient-name="${escHtml(item.name)}">
                                <label for="${itemId}" class="cursor-pointer flex-1">
                                    <span class="item-name">${escHtml(item.name)}</span>
                                </label>
                            </div>
                            <span class="text-muted ml-4">
                                ${escHtml(formatQuantities(item.quantities))}
                            </span>
                        </li>
                    `}).join('')}
                </ul>
            </div>
        `).join('');
    }

    // Display pantry items in sidebar
    if (data.pantry_items && data.pantry_items.length > 0) {
        pantrySection.classList.remove('hidden');
        setHtml(pantryItems, `
            <ul class="space-y-2 text-sm">
                ${data.pantry_items.map((item, idx) => {
                    // Handle both string array and object array formats
                    const itemName = typeof item === 'string' ? item : item.name;
                    const itemQuantities = typeof item === 'string' ? null : item.quantities;
                    return `
                    <li class="flex items-center justify-between py-1">
                        <div class="flex items-center flex-1">
                            <svg class="w-4 h-4 text-ok mr-2 shrink-0" fill="currentColor" viewBox="0 0 20 20">
                                <path fill-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clip-rule="evenodd"></path>
                            </svg>
                            <span class="text-text">${escHtml(itemName)}</span>
                        </div>
                        <span class="text-muted text-xs ml-2">
                            ${itemQuantities ? escHtml(formatQuantities(itemQuantities)) : ''}
                        </span>
                    </li>
                `}).join('')}
            </ul>
        `);
    } else {
        pantrySection.classList.add('hidden');
    }

    if (html === '') {
        setHtml(contentDiv, '<p class="text-faint">' + escHtml({{ tr.t("shopping-no-items")|json|safe }}) + '</p>');
    } else {
        setHtml(contentDiv, html);
    }
}

// Helper function to format quantities
function formatQuantities(quantities) {
    if (!quantities || quantities.length === 0) {
        return '';
    }
    return quantities.map(q => {
        let val = '';

        if (q.value) {
            val = formatCooklangValue(q.value);
        }

        let unit = q.unit || '';
        return `${val} ${unit}`.trim();
    }).join(', ');
}

// Store for checked items - using ingredient names (lowercased) as keys
let checkedItems = new Set();

// Ticks sent but not yet confirmed, and a count of every tick made on this
// page. A read of the checked log that overlapped a tick may have been answered
// before that tick was written, so its answer can't be trusted: see
// applyServerChecked().
let togglesInFlight = 0;
let toggleEpoch = 0;
let resyncWhenIdle = false;
// Ticks go to the server one at a time, in the order they were made. Two
// requests in flight at once can land either way round, and a quick tick and
// untick of the same item landing backwards would leave it ticked.
let toggleChain = Promise.resolve();

// What the copy button puts on the clipboard. Persisted so the choice survives
// a reload — this is a per-device preference, not list state, so it stays in
// localStorage rather than on the server.
const COPY_OPTIONS_KEY = 'shopping-copy-options';
let copyOptions = { aisles: true, amounts: true };

function loadCopyOptions() {
    try {
        const stored = JSON.parse(localStorage.getItem(COPY_OPTIONS_KEY));
        if (stored && typeof stored === 'object') {
            // Anything that isn't an explicit `false` keeps the default — a
            // half-written or older payload degrades to "include everything".
            copyOptions = {
                aisles: stored.aisles !== false,
                amounts: stored.amounts !== false,
            };
        }
    } catch (error) {
        // Malformed JSON, or localStorage blocked entirely (Safari private
        // browsing). Defaults are fine.
        console.error('Failed to read copy options:', error);
    }

    document.getElementById('copy-option-aisles').checked = copyOptions.aisles;
    document.getElementById('copy-option-amounts').checked = copyOptions.amounts;
}

function onCopyOptionChange() {
    copyOptions = {
        aisles: document.getElementById('copy-option-aisles').checked,
        amounts: document.getElementById('copy-option-amounts').checked,
    };
    try {
        localStorage.setItem(COPY_OPTIONS_KEY, JSON.stringify(copyOptions));
    } catch (error) {
        console.error('Failed to save copy options:', error);
    }
}

function toggleCopyOptions() {
    const menu = document.getElementById('copy-options-menu');
    const open = menu.classList.toggle('hidden') === false;
    document.getElementById('copy-options-toggle').setAttribute('aria-expanded', String(open));
}

function closeCopyOptions() {
    document.getElementById('copy-options-menu').classList.add('hidden');
    document.getElementById('copy-options-toggle').setAttribute('aria-expanded', 'false');
}

document.addEventListener('click', (event) => {
    if (!event.target.closest('#copy-list-group')) {
        closeCopyOptions();
    }
});

// Render the current list as plain text for pasting into a notes app: one block
// per aisle category — the category name followed by one bare `name qty` line
// per item — or a single flat block when aisle names are switched off. Items
// already ticked off are left out, and a category that empties out is dropped
// with them. Returns '' when there is nothing left to buy.
function buildPlainTextList() {
    const categories = (lastListData && lastListData.categories) || [];
    const blocks = [];

    for (const category of categories) {
        const lines = (category.items || [])
            .filter(item => !checkedItems.has(String(item.name).toLowerCase()))
            .map(item => {
                const quantities = copyOptions.amounts ? formatQuantities(item.quantities) : '';
                return quantities ? `${item.name} ${quantities}` : item.name;
            });
        if (lines.length > 0) {
            blocks.push(copyOptions.aisles ? [category.category, ...lines].join('\n') : lines.join('\n'));
        }
    }

    if (blocks.length === 0) {
        return '';
    }
    // Blank lines separate aisle blocks; without headings there is nothing to
    // separate, so the categories run together as one list.
    return blocks.join(copyOptions.aisles ? '\n\n' : '\n') + '\n';
}

async function writeToClipboard(text) {
    // `navigator.clipboard` only exists on secure origins, and the server is
    // routinely reached over plain http from a phone on the same network —
    // exactly the case this button is for. Fall back to the legacy path there.
    if (navigator.clipboard && window.isSecureContext) {
        await navigator.clipboard.writeText(text);
        return;
    }

    const textarea = document.createElement('textarea');
    textarea.value = text;
    // Off-screen rather than hidden: `display: none` elements can't be selected.
    textarea.setAttribute('readonly', '');
    textarea.style.position = 'fixed';
    textarea.style.top = '-1000px';
    document.body.appendChild(textarea);
    textarea.select();
    // iOS Safari ignores `select()` on a readonly textarea; it needs an
    // explicit range. Harmless everywhere else.
    textarea.setSelectionRange(0, text.length);
    try {
        if (!document.execCommand('copy')) {
            throw new Error('execCommand("copy") returned false');
        }
    } finally {
        document.body.removeChild(textarea);
    }
}

let copyLabelTimer = null;

async function copyList() {
    const button = document.getElementById('copy-list-button');
    const text = buildPlainTextList();

    if (!text) {
        showError({{ tr.t("shopping-no-items")|json|safe }});
        return;
    }

    hideError();
    try {
        await writeToClipboard(text);
        button.textContent = {{ tr.t("shopping-copied")|json|safe }};
    } catch (error) {
        console.error('Failed to copy shopping list:', error);
        button.textContent = {{ tr.t("shopping-copy-failed")|json|safe }};
    }

    clearTimeout(copyLabelTimer);
    copyLabelTimer = setTimeout(() => {
        button.textContent = {{ tr.t("shopping-copy")|json|safe }};
    }, 1500);
}

// `hidden` and `flex` are both display utilities, so the row has to swap
// between them rather than just dropping `hidden`.
function setHeaderVisible(visible) {
    const header = document.getElementById('shopping-list-header');
    if (!header) return;
    header.classList.toggle('hidden', !visible);
    header.classList.toggle('flex', visible);
    if (!visible) {
        closeCopyOptions();
    }
}

// Hide the button whenever there is nothing to copy — an empty list, or every
// item already ticked off.
function updateCopyButtonVisibility() {
    const group = document.getElementById('copy-list-group');
    if (!group) return;
    const empty = buildPlainTextList() === '';
    group.classList.toggle('hidden', empty);
    if (empty) {
        closeCopyOptions();
    }
}

// Tick every box whose ingredient is in `checkedItems` and untick the rest.
// The strike-through follows the box itself in CSS
// (`.list-checkbox:checked + label`), so the boxes are all there is to keep in
// step — and a box set from script fires no `change`, so this can't loop back
// into toggleItem().
function applyCheckedStates() {
    document.querySelectorAll('#list-content [data-action="toggle-item"]').forEach(box => {
        box.checked = checkedItems.has(box.dataset.ingredientName.toLowerCase());
    });
    updateCopyButtonVisibility();
}

function tickSnapshot() {
    return { epoch: toggleEpoch, busy: togglesInFlight > 0 };
}

// Adopt the server's ticks, read after `ticks` was taken — unless a tick made
// on this page overlapped that read, which may then predate it. Applying such a
// read would briefly untick a box the user had just ticked, inviting a second
// tap that unticks it for real.
function applyServerChecked(names, ticks) {
    if (!ticks.busy && ticks.epoch === toggleEpoch) {
        checkedItems = new Set(names.map(name => String(name).toLowerCase()));
    } else if (togglesInFlight === 0) {
        // The overlapping tick has landed since; read again.
        requestRefresh('checked');
    } else {
        resyncWhenIdle = true;
    }
    applyCheckedStates();
}

function toggleItem(box) {
    const name = box.dataset.ingredientName;
    const key = name.toLowerCase();
    const checked = box.checked;
    const endpoint = checked ? 'check' : 'uncheck';

    // Show the tick straight away; the request only has to confirm it.
    if (checked) {
        checkedItems.add(key);
    } else {
        checkedItems.delete(key);
    }
    applyCheckedStates();

    togglesInFlight++;
    toggleEpoch++;
    toggleChain = toggleChain.then(async () => {
        try {
            const response = await fetch(`{{ prefix }}/api/shopping_list/${endpoint}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name })
            });

            if (!response.ok) {
                throw new Error(await response.text());
            }
        } catch (error) {
            console.error(`Failed to ${endpoint} item:`, error);
            // Take the tick back, and re-read what the server has once every
            // pending tick has settled.
            if (checked) {
                checkedItems.delete(key);
            } else {
                checkedItems.add(key);
            }
            applyCheckedStates();
            resyncWhenIdle = true;
        } finally {
            togglesInFlight--;
            if (togglesInFlight === 0 && resyncWhenIdle) {
                resyncWhenIdle = false;
                requestRefresh('checked');
            }
        }
    });
}

loadCopyOptions();
requestRefresh('list');

// Subscribe to server-pushed change events so sync pulls, other-tab edits,
// or direct `.shopping-list` edits refresh the UI without reload. Each event
// names the file that changed, and a change to the ticks alone only re-reads
// the ticks. This page's own changes come back too; they re-read, find nothing
// new, and leave the page as it is.
// EventSource auto-reconnects on disconnect; we just close it on unload.
let shoppingListEvents = null;
let eventRefreshTimer = null;
let eventRefreshKind = null;
function subscribeToShoppingListEvents() {
    try {
        shoppingListEvents = new EventSource('{{ prefix }}/api/shopping_list/events');
        // Whatever changed while there was no connection went unannounced —
        // including between the first load above and this subscription — so
        // every connection, first or reconnect, starts with a refresh.
        shoppingListEvents.addEventListener('open', () => requestRefresh('list'));
        shoppingListEvents.addEventListener('change', (event) => {
            let file = null;
            try {
                file = JSON.parse(event.data).file;
            } catch (e) {
                // No usable payload: refresh everything.
            }
            if (eventRefreshKind !== 'list') {
                eventRefreshKind = file === 'checked' ? 'checked' : 'list';
            }
            // Coalesce bursts (e.g. .shopping-list and .shopping-checked
            // changing together) into one refresh.
            clearTimeout(eventRefreshTimer);
            eventRefreshTimer = setTimeout(() => {
                const kind = eventRefreshKind;
                eventRefreshKind = null;
                requestRefresh(kind);
            }, 100);
        });
        shoppingListEvents.addEventListener('error', () => {
            // Browser will auto-reconnect. Nothing to do.
        });
    } catch (e) {
        console.error('Failed to subscribe to shopping list events:', e);
    }
}
subscribeToShoppingListEvents();

window.addEventListener('beforeunload', () => {
    if (shoppingListEvents) {
        shoppingListEvents.close();
        shoppingListEvents = null;
    }
});
</script>
