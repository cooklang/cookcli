services:
  cookcli:
    image: ghcr.io/cooklang/cookcli:latest
    # Uncomment and set to your host UID:GID to avoid permission issues with mounted volumes.
    # Find your IDs with: id -u && id -g (default container user is 1000:1000)
    # user: "1000:1000"
    ports:
      - "9080:9080"
    volumes:
      - ./recipes:/recipes
    # Opening the web UI at http://localhost:9080, or at this host's address on
    # the network, needs nothing more. Reaching it by host name — nas.local, or
    # a reverse proxy's domain — means naming that origin, or its pages can
    # read but not save. Separate several with commas.
    # environment:
    #   COOK_CORS_ORIGIN: https://cook.example.com
    restart: unless-stopped
