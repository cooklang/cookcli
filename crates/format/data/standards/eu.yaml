# European Union.
#
# A standard file says three things about how a label is read under that norm:
#   - `tree`: which nutrients exist and how they nest (the shape of the table),
#   - `intakes`: the daily amount a "% of reference" is computed against,
#   - `rating`: the thresholds that colour a nutrient.
# Nutrient names are the canonical keys of `src/nutrition.rs` (schema.org
# `NutritionInformation` properties) where schema.org has one.
#
# `status` says what has been checked against the printed text:
#   verified         the values come from the source named in `source`
#   partly-verified  some of it does, the rest is ours (see the comments)
#   to-verify        written from knowledge, the text was not read
# The regulation texts were read on the UK-retained copies on legislation.gov.uk
# (the Annex of 1924/2006, Annex I, Articles 30 and 31, Annexes XIII to XV of
# 1169/2011), which keep the EU wording; EUR-Lex answered with an empty page.

id: eu
name: European Union
source: "Regulation (EU) No 1169/2011 (Articles 30-31, Annexes I, XIII-XV) and Regulation (EC) No 1924/2006 (Annex)"
url: https://www.legislation.gov.uk/eur/2011/1169/annex/XIII
status:
  intakes: verified          # Annex XIII, parts A and B
  tree: partly-verified      # the macros follow Article 30 and Annex XV; the grouping of minerals and vitamins is ours
  rating: verified           # the nutrition claims of the Annex of 1924/2006
energy_kcal: 2000

# Conventions that decide how the tree is built.
conventions:
  # Annex I: 'carbohydrate' is "any carbohydrate which is metabolised by humans, and includes
  # polyols"; 'fibre' (carbohydrate polymers of three or more units, not digested) is declared apart.
  fibre_in_carbohydrate: false
  # Article 30(1) lists salt, not sodium; Annex I: salt = sodium x 2,5.
  declares: salt
  salt_per_sodium: 2.5

# `declared` says where a nutrient stands in Article 30: mandatory (paragraph 1),
# voluntary (paragraph 2), derived (a total of its children), extra (not in the
# article, kept because the nutrient table has it). The order follows Annex XV.
tree:
  - { name: calories, declared: mandatory }
  - { name: macronutrients, group: true }
  - { name: fatContent, parent: macronutrients, declared: mandatory }
  - { name: saturatedFatContent, parent: fatContent, declared: mandatory }
  - { name: unsaturatedFatContent, parent: fatContent, declared: derived }
  - { name: monounsaturatedFatContent, parent: unsaturatedFatContent, declared: voluntary }
  - { name: polyunsaturatedFatContent, parent: unsaturatedFatContent, declared: voluntary }
  - { name: omega3, parent: polyunsaturatedFatContent, declared: extra }
  - { name: omega6, parent: polyunsaturatedFatContent, declared: extra }
  - { name: transFatContent, parent: fatContent, declared: extra }
  - { name: cholesterolContent, parent: fatContent, declared: extra, relation: listed }
  - { name: carbohydrateContent, parent: macronutrients, declared: mandatory }
  - { name: sugarContent, parent: carbohydrateContent, declared: mandatory }
  - { name: addedSugars, parent: sugarContent, declared: extra }
  - { name: polyols, parent: carbohydrateContent, declared: voluntary }
  - { name: starchContent, parent: carbohydrateContent, declared: voluntary }
  - { name: fiberContent, parent: macronutrients, declared: voluntary }
  - { name: proteinContent, parent: macronutrients, declared: mandatory }
  - { name: other, group: true }
  - { name: salt, parent: other, declared: mandatory }
  - { name: minerals, group: true }
  - { name: macroMinerals, group: true, parent: minerals }
  - { name: calcium, parent: macroMinerals }
  - { name: phosphorus, parent: macroMinerals }
  - { name: magnesium, parent: macroMinerals }
  - { name: sodiumContent, parent: macroMinerals, declared: extra }
  - { name: potassium, parent: macroMinerals }
  - { name: chloride, parent: macroMinerals }
  - { name: traceElements, group: true, parent: minerals }
  - { name: iron, parent: traceElements }
  - { name: zinc, parent: traceElements }
  - { name: copper, parent: traceElements }
  - { name: manganese, parent: traceElements }
  - { name: fluoride, parent: traceElements }
  - { name: selenium, parent: traceElements }
  - { name: chromium, parent: traceElements }
  - { name: molybdenum, parent: traceElements }
  - { name: iodine, parent: traceElements }
  - { name: vitamins, group: true }
  - { name: fatSolubleVitamins, group: true, parent: vitamins }
  - { name: vitaminA, parent: fatSolubleVitamins }
  - { name: vitaminD, parent: fatSolubleVitamins }
  - { name: vitaminE, parent: fatSolubleVitamins }
  - { name: vitaminK, parent: fatSolubleVitamins }
  - { name: waterSolubleVitamins, group: true, parent: vitamins }
  - { name: vitaminC, parent: waterSolubleVitamins }
  - { name: thiamin, parent: waterSolubleVitamins }
  - { name: riboflavin, parent: waterSolubleVitamins }
  - { name: niacin, parent: waterSolubleVitamins }
  - { name: pantothenicAcid, parent: waterSolubleVitamins }
  - { name: vitaminB6, parent: waterSolubleVitamins }
  - { name: biotin, parent: waterSolubleVitamins }
  - { name: folate, parent: waterSolubleVitamins }
  - { name: vitaminB12, parent: waterSolubleVitamins }
  - { name: choline, parent: vitamins, declared: extra }

intakes:
  fatContent: { amount: 70, unit: g }
  saturatedFatContent: { amount: 20, unit: g }
  carbohydrateContent: { amount: 260, unit: g }
  sugarContent: { amount: 90, unit: g }
  proteinContent: { amount: 50, unit: g }
  salt: { amount: 6, unit: g }
  vitaminA: { amount: 800, unit: ug }
  vitaminD: { amount: 5, unit: ug }
  vitaminE: { amount: 12, unit: mg }
  vitaminK: { amount: 75, unit: ug }
  vitaminC: { amount: 80, unit: mg }
  thiamin: { amount: 1.1, unit: mg }
  riboflavin: { amount: 1.4, unit: mg }
  niacin: { amount: 16, unit: mg }
  vitaminB6: { amount: 1.4, unit: mg }
  folate: { amount: 200, unit: ug }
  vitaminB12: { amount: 2.5, unit: ug }
  biotin: { amount: 50, unit: ug }
  pantothenicAcid: { amount: 6, unit: mg }
  potassium: { amount: 2000, unit: mg }
  chloride: { amount: 800, unit: mg }
  calcium: { amount: 800, unit: mg }
  phosphorus: { amount: 700, unit: mg }
  magnesium: { amount: 375, unit: mg }
  iron: { amount: 14, unit: mg }
  zinc: { amount: 10, unit: mg }
  copper: { amount: 1, unit: mg }
  manganese: { amount: 2, unit: mg }
  fluoride: { amount: 3.5, unit: mg }
  selenium: { amount: 55, unit: ug }
  chromium: { amount: 40, unit: ug }
  molybdenum: { amount: 50, unit: ug }
  iodine: { amount: 150, unit: ug }

# Energy per gram, Annex XIV. Fibre counts for 2 kcal, polyols for 2,4, so the
# energy of a recipe is not simply 9 / 4 / 4.
energy_factors:
  fat: { kj: 37, kcal: 9 }
  carbohydrate: { kj: 17, kcal: 4 }   # except polyols
  polyols: { kj: 10, kcal: 2.4 }
  protein: { kj: 17, kcal: 4 }
  salatrims: { kj: 25, kcal: 6 }
  alcohol: { kj: 29, kcal: 7 }
  organicAcid: { kj: 13, kcal: 3 }
  fibre: { kj: 8, kcal: 2 }
  erythritol: { kj: 0, kcal: 0 }

# The conditions of the nutrition claims of the Annex of Regulation (EC) No 1924/2006:
# what a food has to contain to say "low fat" or "source of fibre". They are law, so
# they hold wherever the regulation does (the UK keeps them), whichever way a norm
# colours a nutrient. Numbers as printed; `liquid_max` is the limit per 100 ml for
# liquids; sodium is given as the regulation gives it, "or the salt equivalent"
# (salt = sodium x 2,5). Claims that compare with a similar product (reduced,
# increased, light) are not listed.
claims:
  - { claim: low-energy, nutrient: calories, per: 100g, max: 40, liquid_max: 20, unit: kcal }
  - { claim: energy-free, nutrient: calories, per: 100ml, liquid_max: 4, unit: kcal }
  - { claim: low-fat, nutrient: fatContent, per: 100g, max: 3, liquid_max: 1.5, unit: g, note: "1,8 g per 100 ml for semi-skimmed milk" }
  - { claim: fat-free, nutrient: fatContent, per: 100g, max: 0.5, liquid_max: 0.5, unit: g }
  - { claim: low-saturated-fat, nutrient: saturatedFatContent, per: 100g, max: 1.5, liquid_max: 0.75, unit: g, note: "saturated plus trans fatty acids, and not more than 10 % of the energy" }
  - { claim: saturated-fat-free, nutrient: saturatedFatContent, per: 100g, max: 0.1, liquid_max: 0.1, unit: g, note: "saturated plus trans fatty acids" }
  - { claim: low-sugars, nutrient: sugarContent, per: 100g, max: 5, liquid_max: 2.5, unit: g }
  - { claim: sugars-free, nutrient: sugarContent, per: 100g, max: 0.5, liquid_max: 0.5, unit: g }
  - { claim: low-sodium, nutrient: sodiumContent, per: 100g, max: 120, liquid_max: 120, unit: mg, note: "or the salt equivalent" }
  - { claim: very-low-sodium, nutrient: sodiumContent, per: 100g, max: 40, liquid_max: 40, unit: mg, note: "or the salt equivalent; not for waters" }
  - { claim: sodium-free, nutrient: sodiumContent, per: 100g, max: 5, unit: mg, note: "or the salt equivalent" }
  - { claim: source-of-fibre, nutrient: fiberContent, per: 100g, min: 3, min_per_100kcal: 1.5, unit: g }
  - { claim: high-fibre, nutrient: fiberContent, per: 100g, min: 6, min_per_100kcal: 3, unit: g }
  - { claim: source-of-protein, nutrient: proteinContent, per: energy-share, min: 12, unit: percent }
  - { claim: high-protein, nutrient: proteinContent, per: energy-share, min: 20, unit: percent }

# The EU has no traffic light: a nutrient is coloured by the claims it earns, and
# nothing is ever "bad".
rating:
  kind: claims

# The substances the energy of the donut is made of: those Annex XIV gives energy to
# that the label also declares as a quantity.
energy_sources: [fatContent, carbohydrateContent, proteinContent]

# What a food is to get less of or more of. The EU texts do not say; these come from
# the WHO ("Healthy diet", 2026: saturated fat under 10 % of the energy, trans fat
# under 1 %, free sugars under 10 %, salt under 5 g, at least 25 g of fibre).
direction:
  source: "WHO, Healthy diet (2026)"
  limit: [saturatedFatContent, transFatContent, addedSugars, salt, sodiumContent]
  encourage: [fiberContent]

# Annex XIII part A point 2: the "significant amount" of a vitamin or mineral that a
# "source of" claim needs; "high in" needs twice (Annex of 1924/2006).
significant_amount:
  basis: per-100g
  source_percent: 15
  high_percent: 30
  beverage_percent_per_100ml: 7.5
  single_portion_percent: 15

# The nutrients the page singles out as small cards, in order: what this norm's
# label puts forward (the US gives sodium, the EU salt).
cards: [saturatedFatContent, monounsaturatedFatContent, polyunsaturatedFatContent, omega3, transFatContent, cholesterolContent, sugarContent, starchContent, fiberContent, salt]
