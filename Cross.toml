# The glibc target must NOT use cross's `edge` image. `edge` tracks cross's
# main branch, which is currently Ubuntu 24.04 / glibc 2.39, so the binary ends
# up requiring GLIBC_2.38 (`__isoc23_strtol`/`__isoc23_sscanf`, emitted by gcc
# 13) and GLIBC_2.39 (`pidfd_spawnp`/`pidfd_getpid`, from std's process
# spawning). That broke every distro older than Ubuntu 24.04, including Debian
# 12, which is supported until 2028 and ships glibc 2.36 (issue #420).
#
# cross has published no release since 0.2.5 (Ubuntu 16.04, gcc 5.4), so the
# binary is built in PyPA's manylinux_2_28 image instead: AlmaLinux 8 with
# glibc 2.28, but a current gcc-toolset and cmake, rebuilt upstream several
# times a week. The floor is GLIBC_2.28 (Debian 10+, Ubuntu 20.04+, RHEL 8+);
# release.yaml fails the build if the binary needs anything newer. Pin a dated
# tag, never `latest`, so a release build is reproducible. The musl targets
# below are statically linked, so `edge` is harmless there.
[target.x86_64-unknown-linux-gnu]
image = "quay.io/pypa/manylinux_2_28_x86_64:2026.10.10-1"

[target.x86_64-unknown-linux-musl]
image = "ghcr.io/cross-rs/x86_64-unknown-linux-musl:edge"

[target.i686-unknown-linux-musl]
image = "ghcr.io/cross-rs/i686-unknown-linux-musl:edge"

[target.aarch64-unknown-linux-musl]
image = "ghcr.io/cross-rs/aarch64-unknown-linux-musl:edge"

[target.arm-unknown-linux-musleabihf]
image = "ghcr.io/cross-rs/arm-unknown-linux-musleabihf:edge"

[target.x86_64-unknown-freebsd]
image = "ghcr.io/cross-rs/x86_64-unknown-freebsd:edge"
